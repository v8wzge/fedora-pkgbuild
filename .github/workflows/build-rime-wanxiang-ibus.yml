name: Build Wanxiang Rime schemas (IBus)

on:
  schedule:
    - cron: "7 3 */3 * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the upstream assets are unchanged
        type: boolean
        default: false

concurrency:
  group: rpm-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build-release-multi.yml
    with:
      package: rime-wanxiang-ibus
      release_repo: amzxyz/rime-wanxiang
      asset_name: rime-wanxiang-base.zip
      extra_asset_name: base-dicts.zip
      extra_include_prereleases: true
      spec_files: >-
        specs/rime-wanxiang-ibus-base.spec
        specs/rime-wanxiang-ibus-dicts.spec
      extra_sources: extra/rime-wanxiang-LICENSE
      include_prereleases: false
      fedora_version: ${{ vars.FEDORA_VERSION || '45' }}
      force: ${{ inputs.force || false }}
