name: Build vendor dnf repository

# Mirrors official vendor RPMs (WeChat / QQ / WPS) into a GitHub Release and
# publishes repodata whose location href points at those Release assets.
# Result: `dnf install wechat linuxqq wps-office` works with no client-side
# signing and without storing 300-600 MB binaries in the gh-pages git branch.

on:
  schedule:
    # Every three days, offset from the RPM builders and the index probe.
    - cron: "12 3 */3 * *"
  workflow_dispatch:
    inputs:
      force:
        description: Republish even when probe versions are unchanged
        type: boolean
        default: false

concurrency:
  group: rpm-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-vendor-repo:
    name: Mirror official RPMs into the dnf repository
    runs-on: ubuntu-latest
    container:
      image: fedora:${{ vars.FEDORA_VERSION || '45' }}
      options: --user root
    steps:
      - name: Install tooling
        run: dnf -y install git python3 curl createrepo_c rpm python3-zstandard

      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout dnf repository branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: rpmrepo
          token: ${{ github.token }}

      - name: Probe official download pages
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p ../work
          python3 scripts/download-index/build.py \
            scripts/download-index/probes ../work/index.json
          echo "=== probed versions ==="
          python3 -c 'import json,sys; [print(p["package"], p.get("version", p.get("error")), p["status"]) for p in json.load(open(sys.argv[1]))["packages"]]' ../work/index.json

      - name: Decide whether to publish
        id: decide
        working-directory: source
        env:
          STATE: ../rpmrepo/state/vendor.json
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          result=$(python3 scripts/vendor-repo/decide.py ../work/index.json "$STATE")
          echo "$result" | tr '\t' '\n' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Download and stage vendor RPMs
        if: steps.decide.outputs.changed == 'true'
        working-directory: source
        run: |
          set -euo pipefail
          python3 scripts/vendor-repo/fetch_rpms.py ../work/index.json ../work/rpms

      - name: Upload RPMs to GitHub Release
        if: steps.decide.outputs.changed == 'true'
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/vendor-repo/publish_release.py \
            "${{ github.repository }}" vendor-rpms ../work/rpms

      - name: Generate repodata pointing at the Release
        if: steps.decide.outputs.changed == 'true'
        working-directory: source
        run: |
          set -euo pipefail
          PREFIX="https://github.com/${{ github.repository }}/releases/download/vendor-rpms"
          bash scripts/vendor-repo/generate_repodata.sh \
            ../work/rpms ../rpmrepo "$PREFIX"

      - name: Write state file
        if: steps.decide.outputs.changed == 'true'
        working-directory: source
        run: |
          set -euo pipefail
          python3 - "$FEDORA_VERSION" <<'PY' > ../work/vendor-state.json
          import datetime, json, os, sys
          print(json.dumps({
              "fingerprint": os.environ["FINGERPRINT"],
              "fedora": sys.argv[1],
              "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }, indent=2))
          PY
        env:
          FINGERPRINT: ${{ steps.decide.outputs.fingerprint }}
          FEDORA_VERSION: ${{ vars.FEDORA_VERSION || '45' }}
          PYTHONUNBUFFERED: "1"

      - name: Publish to gh-pages
        if: steps.decide.outputs.changed == 'true'
        working-directory: source
        run: |
          set -euo pipefail
          bash scripts/vendor-repo/publish-vendor.sh ../rpmrepo ../work/vendor-state.json
