name: Update official download index

on:
  schedule:
    # Every three days, offset from the RPM builds at 02:17/27/37 UTC.
    - cron: "47 2 */3 * *"
  workflow_dispatch:

# Shares the gh-pages branch with the RPM builders; serialize all publishes.
concurrency:
  group: rpm-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-index:
    name: Probe official download pages and publish index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout RPM repository branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: rpmrepo
          token: ${{ github.token }}

      - name: Build download index
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p ../work
          python3 scripts/download-index/build.py \
            scripts/download-index/probes \
            ../work/index.json
          python3 -m json.tool ../work/index.json >/dev/null
          echo "=== generated index ==="
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); [print(p["package"], p.get("version", p.get("error")), p["status"]) for p in d["packages"]]' ../work/index.json

      - name: Publish index
        working-directory: source
        run: |
          set -euo pipefail
          bash scripts/download-index/publish-index.sh ../rpmrepo ../work/index.json

      - name: Upload index artifact
        uses: actions/upload-artifact@v4
        with:
          name: download-index
          path: work/index.json
          if-no-files-found: error
